services:
  flashnext:
    build: .
    container_name: flashnext
    ports:
      - "${FLASHNEXT_PORT:-3000}:3000"
    volumes:
      - ./server/data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/flashnext.db
      - TZ=${TZ_NAME:-Asia/Shanghai}
      - FLASHNEXT_TZ=${TZ_NAME:-Asia/Shanghai}
      - FLASHNEXT_ROLLOVER_HOUR=${FLASHNEXT_ROLLOVER_HOUR:-4}
      - FLASHNEXT_LEARN_AHEAD_MINUTES=${FLASHNEXT_LEARN_AHEAD_MINUTES:-20}
      - FLASHNEXT_NEW_PER_DAY=${FLASHNEXT_NEW_PER_DAY:-20}
      - FLASHNEXT_REVIEWS_PER_DAY=${FLASHNEXT_REVIEWS_PER_DAY:-200}
      - FLASHNEXT_DESIRED_RETENTION=${FLASHNEXT_DESIRED_RETENTION:-0.9}
      - FLASHNEXT_MAXIMUM_INTERVAL=${FLASHNEXT_MAXIMUM_INTERVAL:-36500}
      - FLASHNEXT_OPTIMIZE_TIMEOUT_MS=${FLASHNEXT_OPTIMIZE_TIMEOUT_MS:-120000}
    restart: unless-stopped
    networks:
      - default
      - base
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/decks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  base:
    external: true
    name: base_base
